<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Allocation Dashboard</title>
  <style>
    :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #0f172a; color: #f8fafc; }
    body { margin: 0 auto; max-width: 1100px; padding: 24px; }
    h1, h2 { margin-top: 0; }
    .panel, .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
    .card { border-left: 5px solid #64748b; }
    .card.FREE { border-left-color: #22c55e; }
    .card.OCCUPIED { border-left-color: #38bdf8; }
    .card.HIGH_LOAD { border-left-color: #eab308; }
    .card.CRASHED { border-left-color: #ef4444; }
    .muted { color: #94a3b8; }
    .metric { margin: 12px 0; }
    .bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .fill { height: 100%; background: #38bdf8; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    label { display: grid; gap: 5px; }
    input, select, button { box-sizing: border-box; min-height: 40px; border: 1px solid #475569; border-radius: 5px; padding: 8px; background: #0f172a; color: inherit; }
    button { cursor: pointer; background: #2563eb; border-color: #2563eb; }
    #message { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Cloud Resource Allocation</h1>
  <section aria-labelledby="cluster-title">
    <h2 id="cluster-title">Cluster node health</h2>
    <div id="cluster-grid" class="grid" aria-live="polite">Loading nodes...</div>
  </section>
  <section class="panel" aria-labelledby="submit-title" style="margin-top: 22px">
    <h2 id="submit-title">Upload a Python task</h2>
    <p class="muted">The hub stores the script in <code>cluster_task</code>, schedules it, and creates its JSON ticket.</p>
    <form id="task-form">
      <label>Task API token <input name="api_token" type="password" autocomplete="off" required></label>
      <label>Python script <input name="script" type="file" accept=".py,text/x-python" required></label>
      <label>CPU request hint <input name="cpu_hint" type="number" min="0" step="any" value="0"></label>
      <label>GPU request hint (GPU units; 0 = CPU-only) <input name="gpu_hint" type="number" min="0" step="any" value="0"></label>
      <button type="submit">Upload and schedule</button>
    </form>
    <p id="message" role="status"></p>
    <label>Track task ID <input id="track-id" autocomplete="off"></label>
    <button id="track-task" type="button">Refresh task status</button>
    <pre id="task-status" aria-live="polite"></pre>
  </section>
  <script>
    const api = (path) => new URL(path, window.location.origin);

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    async function fetchTelemetry() {
      const container = document.getElementById("cluster-grid");
      try {
        const response = await fetch(api("/api/cluster/status"));
        if (!response.ok) throw new Error(`Hub returned HTTP ${response.status}`);
        const cluster = await response.json();
        container.replaceChildren();
        Object.values(cluster).forEach((node) => {
          const card = document.createElement("article");
          card.className = `card ${node.status}`;
          addText(card, "h3", `${node.node_id} - ${node.status}`);
          addText(card, "p", `IP: ${node.ip_address}`, "muted");
          const metrics = node.metrics || {};
          [["CPU", metrics.cpu_percent], ["RAM", metrics.ram_percent], ["GPU", metrics.gpu_percent]]
            .forEach(([name, value]) => {
              const percent = Math.max(0, Math.min(100, Number(value) || 0));
              const row = addText(card, "div", `${name}: ${percent.toFixed(1)}%`, "metric");
              const bar = document.createElement("div");
              bar.className = "bar";
              const fill = document.createElement("div");
              fill.className = "fill";
              fill.style.width = `${percent}%`;
              bar.appendChild(fill);
              row.appendChild(bar);
            });
          addText(
            card,
            "p",
            `Free RAM: ${metrics.ram_free_gb ?? 0} GB | Tx: ${metrics.net_tx_kbps ?? 0} KB/s | Rx: ${metrics.net_rx_kbps ?? 0} KB/s | RTT: ${metrics.rtt_ms ?? 0} ms`,
            "muted"
          );
          container.appendChild(card);
        });
      } catch (error) {
        container.textContent = `Unable to load telemetry: ${error.message}`;
      }
    }

    document.getElementById("task-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const formElement = event.currentTarget;
      const form = new FormData(formElement);
      const script = form.get("script");
      const message = document.getElementById("message");
      if (!(script instanceof File) || script.size === 0) {
        message.textContent = "Choose a non-empty Python script.";
        return;
      }
      message.textContent = "Uploading task script...";
      try {
        const response = await fetch(api("/api/tasks/upload"), {
          method: "POST",
          headers: {
            "Content-Type": "application/octet-stream",
            "X-API-Token": String(form.get("api_token")),
            "X-File-Name": script.name,
            "X-Baseline-CPU-Req": String(form.get("cpu_hint")),
            "X-Baseline-GPU-Req": String(form.get("gpu_hint"))
          },
          body: script
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || `Hub returned HTTP ${response.status}`);
        document.getElementById("track-id").value = payload.task_id;
        const assignmentMessage = payload.scheduler_status === "assigned"
          ? "Assignment ticket created."
          : "Waiting for an eligible server to become available.";
        message.textContent = `Uploaded ${payload.script_name} (${payload.size_bytes} bytes). ${assignmentMessage}`;
        formElement.reset();
        window.setTimeout(() => trackTask(payload.task_id), 1000);
      } catch (error) {
        message.textContent = `Task upload failed: ${error.message}`;
      }
    });

    async function trackTask(taskId = document.getElementById("track-id").value.trim(), missingAttempts = 0) {
      const status = document.getElementById("task-status");
      if (!taskId) {
        status.textContent = "Enter a task ID or upload a script first.";
        return;
      }
      try {
        const response = await fetch(api(`/api/tasks/${encodeURIComponent(taskId)}`));
        if (response.status === 404 && missingAttempts < 30) {
          status.textContent = `Upload received; waiting for the hub to create the assignment ticket for ${taskId}...`;
          window.setTimeout(() => trackTask(taskId, missingAttempts + 1), 1000);
          return;
        }
        if (response.status === 404) {
          status.textContent = `No assignment ticket was created for ${taskId} after 30 seconds. Check the hub terminal for scheduling warnings.`;
          return;
        }
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || `Hub returned HTTP ${response.status}`);
        status.textContent = JSON.stringify(payload, null, 2);
        if (payload.status === "PENDING" || payload.status === "RUNNING") {
          window.setTimeout(() => trackTask(taskId), 1000);
        }
      } catch (error) {
        status.textContent = `Task status unavailable: ${error.message}`;
      }
    }

    document.getElementById("track-task").addEventListener("click", () => trackTask());
    fetchTelemetry();
    setInterval(fetchTelemetry, 1000);
  </script>
</body>
</html>
